schema: ghost-atlas.apf.context-compiler/v1
output:
  - canonical_baseline
  - target_system
  - active_campaign
  - repository_and_head
  - build_truth_refs
  - upstream_dependencies
  - downstream_dependencies
  - active_services
  - known_failures
  - archived_or_superseded_lineages
